name: Validate repository

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check shell syntax
        run: bash -n scripts/list-skills.sh
      - name: List skills
        run: bash scripts/list-skills.sh
      - name: Check repository structure and plugin metadata
        run: python3 scripts/check-repository.py
